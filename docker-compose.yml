services:
  postgres:
    image: postgres:16-alpine
    container_name: invoices_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-invoices_db}
      POSTGRES_USER: ${DB_USER:-invoices_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminAa1999aA;L*}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-invoices_user} -d ${DB_NAME:-invoices_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
